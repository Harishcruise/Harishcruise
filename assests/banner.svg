<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 260" width="100%" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Harish Kumaravel</title>
  <desc id="d">Animated banner: Full-stack developer focused on scalable data systems and agentic AI</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#1b3358"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
  </defs>
  <style>
    .name { font: 700 54px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #ffffff; }
    .sub  { font: 400 25px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #cbd5e1; opacity: 0; }
    .tag  { font: 500 15px 'Courier New', monospace; fill: #7dd3fc; letter-spacing: 2px; }
    .s1 { animation: cycle 9s ease-in-out infinite; }
    .s2 { animation: cycle 9s ease-in-out infinite 3s; }
    .s3 { animation: cycle 9s ease-in-out infinite 6s; }
    @keyframes cycle {
      0%   { opacity: 0; transform: translateY(10px); }
      8%   { opacity: 1; transform: translateY(0); }
      30%  { opacity: 1; transform: translateY(0); }
      38%  { opacity: 0; transform: translateY(-6px); }
      100% { opacity: 0; }
    }
    .rule { transform-origin: 60px 138px; animation: grow 1.6s ease-out both; }
    @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    .orb { animation: float 7s ease-in-out infinite; }
    .orb2 { animation: float 9s ease-in-out infinite reverse; }
    @keyframes float { 50% { transform: translateY(-14px); } }
  </style>

  <rect width="1000" height="260" rx="18" fill="url(#bg)"/>

  <circle class="orb"  cx="860" cy="70"  r="70" fill="#38bdf8" opacity="0.10"/>
  <circle class="orb2" cx="930" cy="200" r="46" fill="#a78bfa" opacity="0.14"/>
  <circle class="orb"  cx="760" cy="215" r="26" fill="#34d399" opacity="0.14"/>

  <text class="tag" x="60" y="62">&lt;/&gt; SYSTEMS DEVELOPER @ MPAC</text>
  <text class="name" x="60" y="118">Harish Kumaravel</text>
  <rect class="rule" x="60" y="134" width="260" height="4" rx="2" fill="url(#accent)"/>

  <text class="sub s1" x="60" y="190">Full-stack developer</text>
  <text class="sub s2" x="60" y="190">Scalable data systems &amp; event-driven architecture</text>
  <text class="sub s3" x="60" y="190">Agentic AI workflows</text>
</svg>
