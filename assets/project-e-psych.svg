<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 200" width="100%" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">e-psych</title>
  <desc id="d">Mental-health support app with sentiment analysis, voice recognition and community features. Stack: Java, Sentiment analysis, Voice recognition. Opens the GitHub repository.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#16294a"/></linearGradient>
  </defs>
  <style>
    .lbl { font: 500 12px 'Courier New', monospace; letter-spacing: 2px; fill: #38bdf8; }
    .ttl { font: 700 23px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #ffffff; }
    .dsc { font: 400 15px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #94a3b8; }
    .chip { font: 500 12px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #e2e8f0; }
    .cta { font: 600 14px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #38bdf8; }
  </style>
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="0.00s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="0 14" to="0 0" dur="0.6s" begin="0.00s" fill="freeze"/>
    <rect x="2" y="2" width="476" height="196" rx="16" fill="url(#bg)" stroke="#22334f" stroke-width="1.5">
      <animate attributeName="stroke" values="#22334f;#38bdf8;#22334f" dur="6s" begin="1.50s" repeatCount="indefinite"/>
    </rect>
    <rect x="26" y="24" width="0" height="4" rx="2" fill="#38bdf8">
      <animate attributeName="width" from="0" to="56" dur="0.7s" begin="0.30s" fill="freeze"/>
    </rect>
    <text class="lbl" x="26" y="54">PROJECT 01</text>
    <text class="ttl" x="26" y="86">e-psych</text>
    <text class="dsc" x="26" y="114">Mental-health support app with sentiment</text>
    <text class="dsc" x="26" y="135">analysis, voice recognition and community features</text>
    <rect x="26" y="152" width="43" height="24" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.45"/>
    <text class="chip" x="47.5" y="168" text-anchor="middle">Java</text>
    <rect x="77" y="152" width="126" height="24" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.45"/>
    <text class="chip" x="140.0" y="168" text-anchor="middle">Sentiment analysis</text>
    <rect x="211" y="152" width="120" height="24" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.45"/>
    <text class="chip" x="271.0" y="168" text-anchor="middle">Voice recognition</text>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;6 0;0 0" dur="1.8s" begin="1.20s" repeatCount="indefinite"/>
      <text class="cta" x="454" y="168" text-anchor="end">View repo →</text>
    </g>
  </g>
</svg>