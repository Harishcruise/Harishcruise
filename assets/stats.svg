<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 200" width="100%" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Work in numbers</title>
  <desc id="d">6M+ records in a data migration, 4 source systems into one database, 50% smaller Docker images, 2.5 years building production backends</desc>
  <style>
    .num { font: 700 50px 'Segoe UI', Helvetica, Arial, sans-serif; }
    .cap { font: 400 16px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #94a3b8; }
  </style>
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#16294a"/>
    </linearGradient>
  </defs>
  <g>
    <rect x="0" y="12" width="232" height="176" rx="16" fill="url(#card)" stroke="#22334f" stroke-width="1.5">
      <animate attributeName="stroke" values="#22334f;#38bdf8;#22334f" dur="5s" begin="2.00s" repeatCount="indefinite"/>
    </rect>
    <rect x="24" y="36" width="0" height="4" rx="2" fill="#38bdf8">
      <animate attributeName="width" from="0" to="56" dur="0.7s" begin="0.00s" fill="freeze"/>
    </rect>
    <text class="num" x="24" y="108" fill="#38bdf8" opacity="1">0
      <set attributeName="opacity" to="0" begin="0.250s" fill="freeze"/>
    </text>
    <text class="num" x="24" y="108" fill="#38bdf8" opacity="0">1M
      <set attributeName="opacity" to="1" begin="0.250s" fill="freeze"/>
      <set attributeName="opacity" to="0" begin="0.500s" fill="freeze"/>
    </text>
    <text class="num" x="24" y="108" fill="#38bdf8" opacity="0">2M
      <set attributeName="opacity" to="1" begin="0.500s" fill="freeze"/>
      <set attributeName="opacity" to="0" begin="0.750s" fill="freeze"/>
    </text>
    <text class="num" x="24" y="108" fill="#38bdf8" opacity="0">3M
      <set attributeName="opacity" to="1" begin="0.750s" fill="freeze"/>
      <set attributeName="opacity" to="0" begin="1.000s" fill="freeze"/>
    </text>
    <text class="num" x="24" y="108" fill="#38bdf8" opacity="0">4M
      <set attributeName="opacity" to="1" begin="1.000s" fill="freeze"/>
      <set attributeName="opacity" to="0" begin="1.250s" fill="freeze"/>
    </text>
    <text class="num" x="24" y="108" fill="#38bdf8" opacity="0">5M
      <set attributeName="opacity" to="1" begin="1.250s" fill="freeze"/>
      <set attributeName="opacity" to="0" begin="1.500s" fill="freeze"/>
    </text>
    <text class="num" x="24" y="108" fill="#38bdf8" opacity="0">6M+
      <set attributeName="opacity" to="1" begin="1.500s" fill="freeze"/>
    </text>
    <text class="cap" x="24" y="140">records in a</text>
    <text class="cap" x="24" y="162">data migration</text>
  </g>
  <g>
    <rect x="256" y="12" width="232" height="176" rx="16" fill="url(#card)" stroke="#22334f" stroke-width="1.5">
      <animate attributeName="stroke" values="#22334f;#a78bfa;#22334f" dur="5s" begin="2.35s" repeatCount="indefinite"/>
    </rect>
    <rect x="280" y="36" width="0" height="4" rx="2" fill="#a78bfa">
      <animate attributeName="width" from="0" to="56" dur="0.7s" begin="0.35s" fill="freeze"/>
    </rect>
    <text class="num" x="280" y="108" fill="#a78bfa" opacity="1">0
      <set attributeName="opacity" to="0" begin="0.725s" fill="freeze"/>
    </text>
    <text class="num" x="280" y="108" fill="#a78bfa" opacity="0">1
      <set attributeName="opacity" to="1" begin="0.725s" fill="freeze"/>
      <set attributeName="opacity" to="0" begin="1.100s" fill="freeze"/>
    </text>
    <text class="num" x="280" y="108" fill="#a78bfa" opacity="0">2
      <set attributeName="opacity" to="1" begin="1.100s" fill="freeze"/>
      <set attributeName="opacity" to="0" begin="1.475s" fill="freeze"/>
    </text>
    <text class="num" x="280" y="108" fill="#a78bfa" opacity="0">3
      <set attributeName="opacity" to="1" begin="1.475s" fill="freeze"/>
      <set attributeName="opacity" to="0" begin="1.850s" fill="freeze"/>
    </text>
    <text class="num" x="280" y="108" fill="#a78bfa" opacity="0">4
      <set attributeName="opacity" to="1" begin="1.850s" fill="freeze"/>
    </text>
    <text class="cap" x="280" y="140">source systems into</text>
    <text class="cap" x="280" y="162">one database</text>
  </g>
  <g>
    <rect x="512" y="12" width="232" height="176" rx="16" fill="url(#card)" stroke="#22334f" stroke-width="1.5">
      <animate attributeName="stroke" values="#22334f;#34d399;#22334f" dur="5s" begin="2.70s" repeatCount="indefinite"/>
    </rect>
    <rect x="536" y="36" width="0" height="4" rx="2" fill="#34d399">
      <animate attributeName="width" from="0" to="56" dur="0.7s" begin="0.70s" fill="freeze"/>
    </rect>
    <text class="num" x="536" y="108" fill="#34d399" opacity="1">0%
      <set attributeName="opacity" to="0" begin="1.000s" fill="freeze"/>
    </text>
    <text class="num" x="536" y="108" fill="#34d399" opacity="0">10%
      <set attributeName="opacity" to="1" begin="1.000s" fill="freeze"/>
      <set attributeName="opacity" to="0" begin="1.300s" fill="freeze"/>
    </text>
    <text class="num" x="536" y="108" fill="#34d399" opacity="0">20%
      <set attributeName="opacity" to="1" begin="1.300s" fill="freeze"/>
      <set attributeName="opacity" to="0" begin="1.600s" fill="freeze"/>
    </text>
    <text class="num" x="536" y="108" fill="#34d399" opacity="0">30%
      <set attributeName="opacity" to="1" begin="1.600s" fill="freeze"/>
      <set attributeName="opacity" to="0" begin="1.900s" fill="freeze"/>
    </text>
    <text class="num" x="536" y="108" fill="#34d399" opacity="0">40%
      <set attributeName="opacity" to="1" begin="1.900s" fill="freeze"/>
      <set attributeName="opacity" to="0" begin="2.200s" fill="freeze"/>
    </text>
    <text class="num" x="536" y="108" fill="#34d399" opacity="0">50%
      <set attributeName="opacity" to="1" begin="2.200s" fill="freeze"/>
    </text>
    <text class="cap" x="536" y="140">smaller Docker</text>
    <text class="cap" x="536" y="162">images</text>
  </g>
  <g>
    <rect x="768" y="12" width="232" height="176" rx="16" fill="url(#card)" stroke="#22334f" stroke-width="1.5">
      <animate attributeName="stroke" values="#22334f;#fbbf24;#22334f" dur="5s" begin="3.05s" repeatCount="indefinite"/>
    </rect>
    <rect x="792" y="36" width="0" height="4" rx="2" fill="#fbbf24">
      <animate attributeName="width" from="0" to="56" dur="0.7s" begin="1.05s" fill="freeze"/>
    </rect>
    <text class="num" x="792" y="108" fill="#fbbf24" opacity="1">0.0 yrs
      <set attributeName="opacity" to="0" begin="1.350s" fill="freeze"/>
    </text>
    <text class="num" x="792" y="108" fill="#fbbf24" opacity="0">0.5 yrs
      <set attributeName="opacity" to="1" begin="1.350s" fill="freeze"/>
      <set attributeName="opacity" to="0" begin="1.650s" fill="freeze"/>
    </text>
    <text class="num" x="792" y="108" fill="#fbbf24" opacity="0">1.0 yrs
      <set attributeName="opacity" to="1" begin="1.650s" fill="freeze"/>
      <set attributeName="opacity" to="0" begin="1.950s" fill="freeze"/>
    </text>
    <text class="num" x="792" y="108" fill="#fbbf24" opacity="0">1.5 yrs
      <set attributeName="opacity" to="1" begin="1.950s" fill="freeze"/>
      <set attributeName="opacity" to="0" begin="2.250s" fill="freeze"/>
    </text>
    <text class="num" x="792" y="108" fill="#fbbf24" opacity="0">2.0 yrs
      <set attributeName="opacity" to="1" begin="2.250s" fill="freeze"/>
      <set attributeName="opacity" to="0" begin="2.550s" fill="freeze"/>
    </text>
    <text class="num" x="792" y="108" fill="#fbbf24" opacity="0">2.5 yrs
      <set attributeName="opacity" to="1" begin="2.550s" fill="freeze"/>
    </text>
    <text class="cap" x="792" y="140">building production</text>
    <text class="cap" x="792" y="162">backends</text>
  </g>
</svg>
