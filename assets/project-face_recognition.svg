<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 200" width="100%" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">face_recognition</title>
  <desc id="d">Face identification using transfer learning with a VGG-Face CNN. Stack: Python, CNN, Transfer learning. Opens the GitHub repository.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#16294a"/></linearGradient>
  </defs>
  <style>
    .lbl { font: 500 12px 'Courier New', monospace; letter-spacing: 2px; fill: #a78bfa; }
    .ttl { font: 700 23px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #ffffff; }
    .dsc { font: 400 15px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #94a3b8; }
    .chip { font: 500 12px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #e2e8f0; }
    .cta { font: 600 14px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #a78bfa; }
  </style>
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="0.25s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="0 14" to="0 0" dur="0.6s" begin="0.25s" fill="freeze"/>
    <rect x="2" y="2" width="476" height="196" rx="16" fill="url(#bg)" stroke="#22334f" stroke-width="1.5">
      <animate attributeName="stroke" values="#22334f;#a78bfa;#22334f" dur="6s" begin="1.75s" repeatCount="indefinite"/>
    </rect>
    <rect x="26" y="24" width="0" height="4" rx="2" fill="#a78bfa">
      <animate attributeName="width" from="0" to="56" dur="0.7s" begin="0.55s" fill="freeze"/>
    </rect>
    <text class="lbl" x="26" y="54">PROJECT 02</text>
    <text class="ttl" x="26" y="86">face_recognition</text>
    <text class="dsc" x="26" y="114">Face identification using transfer learning</text>
    <text class="dsc" x="26" y="135">with a VGG-Face CNN</text>
    <rect x="26" y="152" width="55" height="24" rx="12" fill="#1e293b" stroke="#a78bfa" stroke-opacity="0.45"/>
    <text class="chip" x="53.5" y="168" text-anchor="middle">Python</text>
    <rect x="89" y="152" width="37" height="24" rx="12" fill="#1e293b" stroke="#a78bfa" stroke-opacity="0.45"/>
    <text class="chip" x="107.5" y="168" text-anchor="middle">CNN</text>
    <rect x="134" y="152" width="120" height="24" rx="12" fill="#1e293b" stroke="#a78bfa" stroke-opacity="0.45"/>
    <text class="chip" x="194.0" y="168" text-anchor="middle">Transfer learning</text>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;6 0;0 0" dur="1.8s" begin="1.45s" repeatCount="indefinite"/>
      <text class="cta" x="454" y="168" text-anchor="end">View repo →</text>
    </g>
  </g>
</svg>