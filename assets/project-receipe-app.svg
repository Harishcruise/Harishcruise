<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 200" width="100%" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">receipe-app</title>
  <desc id="d">Mobile app for exploring and cooking recipes, where chefs can post their own. Stack: React Native, JavaScript. Opens the GitHub repository.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#16294a"/></linearGradient>
  </defs>
  <style>
    .lbl { font: 500 12px 'Courier New', monospace; letter-spacing: 2px; fill: #34d399; }
    .ttl { font: 700 23px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #ffffff; }
    .dsc { font: 400 15px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #94a3b8; }
    .chip { font: 500 12px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #e2e8f0; }
    .cta { font: 600 14px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #34d399; }
  </style>
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="0.50s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="0 14" to="0 0" dur="0.6s" begin="0.50s" fill="freeze"/>
    <rect x="2" y="2" width="476" height="196" rx="16" fill="url(#bg)" stroke="#22334f" stroke-width="1.5">
      <animate attributeName="stroke" values="#22334f;#34d399;#22334f" dur="6s" begin="2.00s" repeatCount="indefinite"/>
    </rect>
    <rect x="26" y="24" width="0" height="4" rx="2" fill="#34d399">
      <animate attributeName="width" from="0" to="56" dur="0.7s" begin="0.80s" fill="freeze"/>
    </rect>
    <text class="lbl" x="26" y="54">PROJECT 03</text>
    <text class="ttl" x="26" y="86">receipe-app</text>
    <text class="dsc" x="26" y="114">Mobile app for exploring and cooking recipes,</text>
    <text class="dsc" x="26" y="135">where chefs can post their own</text>
    <rect x="26" y="152" width="90" height="24" rx="12" fill="#1e293b" stroke="#34d399" stroke-opacity="0.45"/>
    <text class="chip" x="71.0" y="168" text-anchor="middle">React Native</text>
    <rect x="124" y="152" width="79" height="24" rx="12" fill="#1e293b" stroke="#34d399" stroke-opacity="0.45"/>
    <text class="chip" x="163.5" y="168" text-anchor="middle">JavaScript</text>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;6 0;0 0" dur="1.8s" begin="1.70s" repeatCount="indefinite"/>
      <text class="cta" x="454" y="168" text-anchor="end">View repo →</text>
    </g>
  </g>
</svg>