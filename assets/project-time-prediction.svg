<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 200" width="100%" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Food delivery time prediction</title>
  <desc id="d">Estimating food-delivery times to improve delivery efficiency. Stack: Python, Jupyter Notebook. Opens the GitHub repository.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#16294a"/></linearGradient>
  </defs>
  <style>
    .lbl { font: 500 12px 'Courier New', monospace; letter-spacing: 2px; fill: #fbbf24; }
    .ttl { font: 700 23px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #ffffff; }
    .dsc { font: 400 15px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #94a3b8; }
    .chip { font: 500 12px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #e2e8f0; }
    .cta { font: 600 14px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #fbbf24; }
  </style>
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="0.75s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="0 14" to="0 0" dur="0.6s" begin="0.75s" fill="freeze"/>
    <rect x="2" y="2" width="476" height="196" rx="16" fill="url(#bg)" stroke="#22334f" stroke-width="1.5">
      <animate attributeName="stroke" values="#22334f;#fbbf24;#22334f" dur="6s" begin="2.25s" repeatCount="indefinite"/>
    </rect>
    <rect x="26" y="24" width="0" height="4" rx="2" fill="#fbbf24">
      <animate attributeName="width" from="0" to="56" dur="0.7s" begin="1.05s" fill="freeze"/>
    </rect>
    <text class="lbl" x="26" y="54">PROJECT 04</text>
    <text class="ttl" x="26" y="86">Food delivery time prediction</text>
    <text class="dsc" x="26" y="114">Estimating food-delivery times to improve</text>
    <text class="dsc" x="26" y="135">delivery efficiency</text>
    <rect x="26" y="152" width="55" height="24" rx="12" fill="#1e293b" stroke="#fbbf24" stroke-opacity="0.45"/>
    <text class="chip" x="53.5" y="168" text-anchor="middle">Python</text>
    <rect x="89" y="152" width="114" height="24" rx="12" fill="#1e293b" stroke="#fbbf24" stroke-opacity="0.45"/>
    <text class="chip" x="146.0" y="168" text-anchor="middle">Jupyter Notebook</text>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;6 0;0 0" dur="1.8s" begin="1.95s" repeatCount="indefinite"/>
      <text class="cta" x="454" y="168" text-anchor="end">View repo →</text>
    </g>
  </g>
</svg>